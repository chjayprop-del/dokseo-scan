<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>바코드 스캔</title>
<!--
  우리집 독서관리 앱의 바코드 스캔 화면.
  구글 Apps Script 앱 안에서는 카메라가 막혀 있어서, 이 페이지를 새 창으로 열어 바코드를 읽고
  읽은 ISBN만 앱으로 돌려준다. 아무 정보도 저장하거나 보내지 않는다 (고른 카메라만 이 폰에 기억).
  앱 주소는 #app=… 로 받음 (주소 뒤 # 부분은 서버로 가지 않음).
-->
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font:16px/1.4 -apple-system,"Noto Sans KR",sans-serif;overflow:hidden}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
.box{position:fixed;left:4%;right:4%;top:24%;height:36%;border:3px solid #6f6;border-radius:12px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);pointer-events:none}
.top{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;background:rgba(0,0,0,.5)}
.top button{padding:9px 13px;font-size:15px;background:rgba(255,255,255,.18);color:#fff}
.top button.on{background:#6f6;color:#000}
.bar{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.65)}
.bar div{flex:1}
button{font:inherit;padding:12px 18px;border-radius:10px;border:0;background:#fff;color:#222}
.tip{position:fixed;left:0;right:0;top:62%;text-align:center;font-size:14px;color:#dfd;text-shadow:0 1px 3px #000;pointer-events:none}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<div class="box"></div>
<div class="tip" id="tip">폰을 책에서 20~30cm 떼고 · 흐리면 화면을 톡 누르세요</div>
<div class="top" id="top">
  <button id="bz" hidden>확대 1x</button>
  <button id="bt" hidden>플래시</button>
  <button id="bc" hidden>카메라 바꾸기</button>
</div>
<div class="bar"><div id="m">카메라 여는 중…</div><button id="x">닫기</button></div>
<script>
(function () {
  'use strict';
  var ZX = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
  var APP = '';
  var mh = /[#&]app=([^&]+)/.exec(location.hash);
  if (mh) { try { var u = decodeURIComponent(mh[1]); if (/^https:\/\/script\.google\.com\/macros\//.test(u)) APP = u; } catch (e) {} }
  var v = document.getElementById('v'), m = document.getElementById('m');
  var bz = document.getElementById('bz'), bt = document.getElementById('bt'), bc = document.getElementById('bc');
  var done = false, stream = null, track = null, caps = {}, cams = [], camIdx = -1, zooms = [], zi = 0, torch = false, scanning = false;
  function store(k, val) { try { if (val === undefined) return localStorage.getItem(k); localStorage.setItem(k, val); } catch (e) { return null; } }

  function ok(s) {
    s = String(s || '').replace(/[^0-9X]/g, '');
    if (!/^97[89]\d{10}$/.test(s)) return '';
    var t = 0; for (var j = 0; j < 12; j++) t += Number(s[j]) * (j % 2 ? 3 : 1);
    return (10 - t % 10) % 10 === Number(s[12]) ? s : '';
  }
  function stop() { if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; track = null; }
  function send(s) {
    if (done) return; done = true;
    try { if (navigator.vibrate) navigator.vibrate(80); } catch (e) {}
    m.textContent = '읽었어요: ' + s; stop();
    var back = false;
    try { if (window.opener && !window.opener.closed) { window.opener.postMessage({ dkIsbn: s }, '*'); back = true; } } catch (e) {}
    if (back) setTimeout(function () { window.close(); }, 250);
    else if (APP) location.href = APP + '?isbn=' + s;
    else m.textContent = '읽었어요: ' + s + ' — 앱으로 돌아가 이 숫자를 넣어 주세요';
  }
  document.getElementById('x').onclick = function () { stop(); window.close(); };

  // ---- 카메라 고르기: 후면 카메라 중 '기본(메인)' 카메라. 광각 카메라는 가까이 초점이 안 맞음 ----
  function backCams(list) {
    var vids = list.filter(function (d) { return d.kind === 'videoinput'; });
    var back = vids.filter(function (d) { return /back|rear|environment|후면|뒤/i.test(d.label); });
    if (!back.length) back = vids;
    // 광각·망원은 뒤로, 번호 작은 것(보통 메인)이 앞으로
    function score(d) {
      var l = d.label, n = /(\d+)(?!.*\d)/.exec(l), s = n ? Number(n[1]) : 50;
      if (/ultra|wide|광각|0\.5/i.test(l)) s += 100;
      if (/tele|망원/i.test(l)) s += 60;
      return s;
    }
    return back.slice().sort(function (a, b) { return score(a) - score(b); });
  }
  function constraints(devId) {
    var vc = { width: { ideal: 1920 }, height: { ideal: 1080 }, advanced: [{ focusMode: 'continuous' }] };
    if (devId) vc.deviceId = { exact: devId }; else vc.facingMode = { ideal: 'environment' };
    return { video: vc, audio: false };
  }
  function open(devId) {
    stop();
    return navigator.mediaDevices.getUserMedia(constraints(devId)).then(function (st) {
      stream = st; track = st.getVideoTracks()[0]; v.srcObject = st; return v.play();
    }).then(tune);
  }
  function tune() {
    caps = {}; try { caps = track.getCapabilities ? track.getCapabilities() : {}; } catch (e) {}
    var adv = {};
    if (caps.focusMode && caps.focusMode.indexOf('continuous') >= 0) adv.focusMode = 'continuous';
    // 확대: 가까이 대지 않아도 바코드가 크게 보이게 (멀리 두면 초점이 잘 맞음)
    zooms = [];
    if (caps.zoom && caps.zoom.max > caps.zoom.min) {
      [1, 1.5, 2, 3].forEach(function (z) { if (z >= caps.zoom.min && z <= caps.zoom.max) zooms.push(z); });
      if (zooms.length < 2) zooms = [caps.zoom.min, caps.zoom.max];
      var want = Number(store('dk_zoom')) || 2, best = 0;
      zooms.forEach(function (z, i) { if (Math.abs(z - want) < Math.abs(zooms[best] - want)) best = i; });
      zi = best; adv.zoom = zooms[zi];
    }
    bz.hidden = zooms.length < 2; bz.textContent = '확대 ' + (zooms[zi] || 1) + 'x';
    bt.hidden = !caps.torch; torch = false; bt.className = '';
    bc.hidden = cams.length < 2;
    if (Object.keys(adv).length) return track.applyConstraints({ advanced: [adv] }).catch(function () {});
  }
  function focusNow() {
    if (!track || !caps.focusMode) return;
    var a = { pointsOfInterest: [{ x: 0.5, y: 0.42 }] };
    if (caps.focusMode.indexOf('single-shot') >= 0) {
      a.focusMode = 'single-shot';
      track.applyConstraints({ advanced: [a] }).catch(function () {}).then(function () {
        setTimeout(function () { if (track && caps.focusMode.indexOf('continuous') >= 0) track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function () {}); }, 1200);
      });
    } else if (caps.focusMode.indexOf('continuous') >= 0) {
      a.focusMode = 'continuous'; track.applyConstraints({ advanced: [a] }).catch(function () {});
    }
  }
  v.addEventListener('click', function () { focusNow(); m.textContent = '초점 맞추는 중…'; setTimeout(function () { if (!done) m.textContent = hint(); }, 1200); });
  bz.onclick = function () {
    if (!track || zooms.length < 2) return;
    zi = (zi + 1) % zooms.length; store('dk_zoom', String(zooms[zi]));
    bz.textContent = '확대 ' + zooms[zi] + 'x';
    track.applyConstraints({ advanced: [{ zoom: zooms[zi] }] }).catch(function () {});
  };
  bt.onclick = function () {
    if (!track) return; torch = !torch; bt.className = torch ? 'on' : '';
    track.applyConstraints({ advanced: [{ torch: torch }] }).catch(function () {});
  };
  bc.onclick = function () {
    if (cams.length < 2) return;
    camIdx = (camIdx + 1) % cams.length; store('dk_cam', cams[camIdx].deviceId);
    m.textContent = '카메라 바꾸는 중… (' + (camIdx + 1) + '/' + cams.length + ')';
    open(cams[camIdx].deviceId).then(function () { m.textContent = hint(); }).catch(function () { m.textContent = '이 카메라는 못 써요. 한 번 더 눌러 주세요.'; });
  };
  function hint() { return '책 뒷면 바코드를 초록 상자에 맞춰 주세요'; }

  // ---- 바코드 읽기 ----
  function startScan() {
    if (scanning) return; scanning = true;
    var det = null;
    var p = ('BarcodeDetector' in window) ? BarcodeDetector.getSupportedFormats().then(function (f) { return f.indexOf('ean_13') >= 0 ? new BarcodeDetector({ formats: ['ean_13'] }) : null; }).catch(function () { return null; }) : Promise.resolve(null);
    p.then(function (d) {
      det = d;
      if (det) {
        var loop = function () {
          if (done) return;
          if (!v.videoWidth) return setTimeout(loop, 200);
          det.detect(v).then(function (r) { for (var i = 0; i < r.length; i++) { var s = ok(r[i].rawValue); if (s) return send(s); } setTimeout(loop, 90); }).catch(function () { setTimeout(loop, 300); });
        };
        return loop();
      }
      var sc = document.createElement('script'); sc.src = ZX;
      sc.onload = function () {
        var Z = window.ZXing, c = document.createElement('canvas'), hints = new Map();
        hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13]); hints.set(Z.DecodeHintType.TRY_HARDER, true);
        var rd = new Z.MultiFormatReader(); rd.setHints(hints);
        var loop = function () {
          if (done) return;
          var w = v.videoWidth, h = v.videoHeight;
          if (w) {
            var cw = Math.round(w * 0.92), ch = Math.round(h * 0.45); c.width = cw; c.height = ch;
            c.getContext('2d').drawImage(v, (w - cw) / 2, (h - ch) / 2, cw, ch, 0, 0, cw, ch);
            try { var s = ok(rd.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c)))).getText()); if (s) return send(s); } catch (e) {}
          }
          setTimeout(loop, 150);
        };
        loop();
      };
      sc.onerror = function () { m.textContent = '바코드 인식기를 못 불러왔어요. 닫고 \'사진으로 찍기\'를 써 주세요.'; };
      document.head.appendChild(sc);
    });
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { m.textContent = '이 브라우저에선 카메라를 못 써요. 크롬으로 열어 주세요.'; return; }
  var saved = store('dk_cam');
  open(saved || null).catch(function (e) {
    if (saved) return open(null); // 저장된 카메라가 없어졌으면 기본으로
    throw e;
  }).then(function () {
    m.textContent = hint();
    startScan();
    // 권한을 받은 뒤라 카메라 이름이 보임 → 메인 카메라로 바꿔 열기
    return navigator.mediaDevices.enumerateDevices().then(function (list) {
      cams = backCams(list);
      bc.hidden = cams.length < 2;
      var cur = track && track.getSettings ? track.getSettings().deviceId : '';
      camIdx = -1; cams.forEach(function (d, i) { if (d.deviceId === cur) camIdx = i; });
      if (!saved && cams.length > 1 && cams[0].deviceId && cams[0].deviceId !== cur) {
        camIdx = 0;
        return open(cams[0].deviceId).catch(function () { return open(cur || null); });
      }
    }).catch(function () {});
  }).catch(function (e) {
    m.textContent = '카메라를 못 열었어요 (' + ((e && e.name) || e) + '). 카메라 권한을 허용하거나, 닫고 \'사진으로 찍기\'를 써 주세요.';
  });
})();
</script>
</body>
</html>
